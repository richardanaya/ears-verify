name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install a linker
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
