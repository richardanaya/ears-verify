name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install a linker
        timeout-minutes: 5
        run: |
          command -v clang >/dev/null || (sudo apt-get update && sudo apt-get install -y clang)
          clang --version
      - name: Install dependencies
        run: npm ci
      - name: Require ScriptC 0.4.2
        run: test "$(node_modules/.bin/scriptc --version)" = "0.4.2"
      - name: Coverage gate
        run: |
          set -eu
          for entry in src/main.ts test/unit.ts test/run-all.ts; do
            out="$(node_modules/.bin/scriptc coverage "$entry" --fail-on=blockers)"
            printf '%s\n' "$out"
            printf '%s\n' "$out" | grep -q '(100%)'
            printf '%s\n' "$out" | grep -q 'fully static'
            if printf '%s\n' "$out" | grep -q 'blockers'; then
              echo "coverage blockers in $entry" >&2
              exit 1
            fi
          done
      - name: ScriptC build
        run: |
          node_modules/.bin/scriptc build src/main.ts -o build/plan-verify
          node_modules/.bin/scriptc build test/unit.ts -o build/unit-tests
      - name: Test on Node and native
        run: npm test
      - name: Lint gen-25 bound
        run: |
          set +e
          timeout 20 ./build/plan-verify lint bench/specs/gen-25.ears.md >/dev/null
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            echo "gen-25 lint exceeded 20s" >&2
            exit 1
          fi
          if [ "$code" -gt 1 ]; then
            echo "gen-25 lint failed to run ($code)" >&2
            exit 1
          fi
